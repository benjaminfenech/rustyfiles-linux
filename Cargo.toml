[workspace]
resolver = "3"
members = ["crates/rf-core", "crates/rf-linux", "crates/rf-app", "crates/rf-archive", "crates/rf-player"]

[workspace.package]
version = "0.11.1"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
rf-core = { path = "crates/rf-core" }
rf-linux = { path = "crates/rf-linux" }
rf-player = { path = "crates/rf-player" }
# FilmCraft (MIT OR Apache-2.0): saf Rust kapsayıcı ve kodek çözücüleri, sabit commit.
filmcraft-media = { git = "https://github.com/storytold/filmcraft", rev = "c2f65871e998cca4700a74dbcf9348cab51fb06b" }
filmcraft-codecs = { git = "https://github.com/storytold/filmcraft", rev = "c2f65871e998cca4700a74dbcf9348cab51fb06b" }
filmcraft-frame = { git = "https://github.com/storytold/filmcraft", rev = "c2f65871e998cca4700a74dbcf9348cab51fb06b" }
filmcraft-color = { git = "https://github.com/storytold/filmcraft", rev = "c2f65871e998cca4700a74dbcf9348cab51fb06b" }
filmcraft-time = { git = "https://github.com/storytold/filmcraft", rev = "c2f65871e998cca4700a74dbcf9348cab51fb06b" }
gpui-kit = "0.9.0"
anyhow = "1"
thiserror = "2"
log = "0.4"
parking_lot = "0.12"
smallvec = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
crossbeam-channel = "0.5"
futures = "0.3"
notify = "8"
raw-window-handle = "0.6"
image = { version = "0.25", default-features = false }
rayon = "1"
dirs = "6"
chrono = "0.4"
natord = "1"
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
crc32fast = "1"
regex = "1"
rf-archive = { path = "crates/rf-archive" }
tar = { version = "0.4", default-features = false }
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
zstd = { version = "0.14", default-features = false, features = ["zstdmt"] }
zip = { version = "9.3", default-features = false, features = ["deflate-flate2-zlib-rs", "deflate64", "aes-crypto"] }
sevenz-rust2 = { version = "0.24", default-features = false, features = ["compress", "aes256"] }
hadris-iso = { version = "3.0.0-rc.3", default-features = false, features = ["std", "sync"] }
hadris-fs = "3.0.0-rc.3"
hadris-io = "3.0.0-rc.3"
hadris-udf = { version = "3.0.0-rc.3", default-features = false, features = ["std", "sync"] }
hadris-storage = "3.0.0-rc.3"
lzma-rust2 = { version = "0.25", default-features = false, features = ["std", "xz", "encoder"] }

[profile.dev]
# Keep debug builds snappy: optimize deps, keep our code debuggable.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

# hot loops (natural sort of 100k names) stay fast in debug builds too
[profile.dev.package.rf-core]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
panic = "abort"
strip = true
debug = false

# Iterating on optimized builds: release without LTO, incremental. A one-line change in rf-app
# took 144 s with --release (thin LTO links the two exes) against ~10 s in dev (measured by the
# rustbuilder session). Speed numbers and published builds still come from --release.
#   cargo build --profile fast -p rf-app   →   target/fast/rfiles
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
